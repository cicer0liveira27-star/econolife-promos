name: Alertas (Telegram)

# Roda sozinho quando o robô grava ofertas novas, ou pelo botão do app (teste / resumo).
on:
  push:
    branches: [main]
    paths: ['data/ofertas.json']
  workflow_dispatch:
    inputs:
      modo:
        description: 'teste, resumo ou novos'
        required: false
        default: 'teste'

permissions:
  contents: write

concurrency:
  group: alertas
  cancel-in-progress: false

jobs:
  enviar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Enviar alertas
        env:
          MODO: ${{ github.event.inputs.modo || 'novos' }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          WA_PHONE_1: ${{ secrets.WA_PHONE_1 }}
          WA_KEY_1: ${{ secrets.WA_KEY_1 }}
          WA_PHONE_2: ${{ secrets.WA_PHONE_2 }}
          WA_KEY_2: ${{ secrets.WA_KEY_2 }}
          SITE_URL: https://cicer0liveira27-star.github.io/econolife-promos/
        run: python scripts/enviar_whatsapp.py
