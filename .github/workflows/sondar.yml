name: Teste de fontes

on:
  push:
    branches: [main]
    paths: ['scripts/sondar.py']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sondar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/sondar.py
      - run: |
          git config user.name "Econolife Promos"
          git config user.email "actions@users.noreply.github.com"
          git add data/sondagem.json
          git commit -m "Teste de fontes" || exit 0
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep 5; done
